name: Deploy to GitHub Pages

# Shows a different portfolio design every morning, the same way the profile README rotates.
# The designs are main plus every portfolio/* branch (portfolio/base is the starter, not a design),
# worked through in alphabetical order, one a day. Nothing is committed: today's branch is built
# and deployed as it is. A push to main redeploys today's pick.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 23 * * *" # 05:00 India time, same as the profile README
  workflow_dispatch:
    inputs:
      design:
        description: "Design to show, e.g. main or portfolio/kolam (leave empty for today's pick)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every design branch has to be on hand
      - name: Pick today's design
        env:
          CHOSEN: ${{ inputs.design }}
        run: |
          designs=$( (echo main; git branch -r --format='%(refname:lstrip=3)' | grep '^portfolio/' | grep -v -x portfolio/base) | sort)
          count=$(echo "$designs" | wc -l)
          if [ -n "$CHOSEN" ]; then
            echo "$designs" | grep -q -x -- "$CHOSEN" || { echo "No design called $CHOSEN"; exit 1; }
            design=$CHOSEN
          else
            day=$(( ($(date +%s) + 19800) / 86400 )) # days since 1970 on India time
            design=$(echo "$designs" | sed -n "$(( day % count + 1 ))p")
          fi
          echo "Today's design: $design (one of $count)" | tee -a "$GITHUB_STEP_SUMMARY"
          git checkout -q "origin/$design"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
