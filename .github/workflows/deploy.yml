name: Deploy to GitHub Pages

# Shows a different portfolio design every morning, the same way the profile README rotates.
# The designs are main plus every portfolio/* branch (portfolio/base is the starter, not a design),
# worked through in alphabetical order, one a day. Nothing is committed: today's branch is built
# and deployed as it is. A push to main redeploys today's pick.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 23 * * *" # 05:00 India time, same as the profile README
  workflow_dispatch:
    inputs:
      design:
        description: "Design to show, e.g. main or portfolio/kolam (leave empty for today's pick)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every design branch has to be on hand
      - name: Pick today's design
        env:
          CHOSEN: ${{ inputs.design }}
        run: |
          designs=$( (echo main; git branch -r --format='%(refname:lstrip=3)' | grep '^portfolio/' | grep -v -x portfolio/base) | LC_ALL=C sort)
          count=$(echo "$designs" | wc -l)
          if [ -n "$CHOSEN" ]; then
            echo "$designs" | grep -q -x -- "$CHOSEN" || { echo "No design called $CHOSEN"; exit 1; }
            design=$CHOSEN
          else
            # Carry on from the design the live site shows (design.txt, written below). Picking by day
            # number instead jumped back to designs already shown every time a branch was added.
            last=$(curl -fsS "https://krish-exe-29.github.io/KRISH_Portfolio/design.txt?$(date +%s)" || true)
            if [ -z "$last" ]; then
              day=$(( ($(date +%s) + 19800) / 86400 )) # days since 1970 on India time
              design=$(echo "$designs" | sed -n "$(( day % count + 1 ))p")
            elif [ "${last#* }" = "$(TZ=Asia/Kolkata date +%F)" ] && echo "$designs" | grep -q -x -- "${last% *}"; then
              design=${last% *} # already shown today, redeploy it
            else
              design=$(echo "$designs" | LC_ALL=C awk -v last="${last% *}" '$0 > last { print; exit }')
              [ -n "$design" ] || design=$(echo "$designs" | head -1)
            fi
          fi
          echo "Today's design: $design (one of $count)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "DESIGN=$design" >> "$GITHUB_ENV"
          git checkout -q "origin/$design"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: echo "$DESIGN $(TZ=Asia/Kolkata date +%F)" > dist/design.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
